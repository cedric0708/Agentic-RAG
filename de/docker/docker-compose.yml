version: '3.8'

# ============================================================
# drug-rag-de : Airflow + ETL Worker
# 실행: docker-compose --env-file ../config/.env up -d
# Airflow UI: http://localhost:8080 (admin / admin)
# ============================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # AWS / API 키를 Airflow 컨테이너에 전달
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    S3_BUCKET: ${S3_BUCKET}
    PUBLIC_API_KEY: ${PUBLIC_API_KEY}
  volumes:
    - ../dags:/opt/airflow/dags
    - ../scripts:/opt/airflow/scripts
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL (Airflow 메타DB) ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: drug_rag_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"    # ← 추가
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  # ── Airflow 초기화 (최초 1회) ────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: drug_rag_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install boto3 requests beautifulsoup4 lxml pandas loguru tenacity tqdm --quiet
        airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@drugrag.com \
          --password admin
    restart: on-failure

  # ── Airflow 웹서버 ───────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: drug_rag_airflow_web
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow 스케줄러 ─────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: drug_rag_airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── ETL 작업용 Python 컨테이너 ───────────────────────────
  etl-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: drug_rag_etl_worker
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      S3_BUCKET: ${S3_BUCKET}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY}
    volumes:
      - ../scripts:/app/scripts
      - ../config:/app/config
    restart: unless-stopped

    # ── Neo4j ───────────────────────────────────────────
  neo4j:
    image: neo4j:5.18-community
    container_name: drug_graph
    ports:
      - "7474:7474"   # Neo4j Browser (웹 UI)
      - "7687:7687"   # Bolt 프로토콜 (Python 연결)
    environment:
      - NEO4J_AUTH=neo4j/neo4j111   # ID/PW 설정
      - NEO4J_PLUGINS=["apoc"]          # 유틸 플러그인
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs:
  neo4j_data:
  neo4j_logs:
